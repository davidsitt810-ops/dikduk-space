<title>Dikduk letters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;700&display=swap">
<style>
/* The letter checker: pick a letter, hear Rabbi Alouf say a word that opens with it, say it yourself, and the server
   judges the opening consonant of your take (POST /letter). Same look as the booth (record.html). */
:root{--bg:#2A1317;--panel:#3A1C22;--line:#5A3038;--fg:#F3E6CF;--mute:#C9AE96;--gold:#D8B060;--good:#9BD3A0;--warn:#F2C230;--bad:#EF7B6E;--ink:#2A1317;
 --he:"Frank Ruhl Libre",Georgia,serif;--ui:"Heebo",system-ui,-apple-system,sans-serif;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#FBF6EC;--panel:#FFFFFF;--line:#E6D7C0;--fg:#2A1317;--mute:#6E5A4C;--gold:#A8782A;--good:#2E8B4A;--warn:#B8860B;--bad:#C0392B;--ink:#FFFFFF;color-scheme:light}}
:root[data-theme="light"]{--bg:#FBF6EC;--panel:#FFFFFF;--line:#E6D7C0;--fg:#2A1317;--mute:#6E5A4C;--gold:#A8782A;--good:#2E8B4A;--warn:#B8860B;--bad:#C0392B;--ink:#FFFFFF;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.45;margin:0;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 72px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font:700 24px/1.15 var(--ui);margin:0}
.pill{flex:none;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;margin-top:4px}
.pill.ok{border-color:var(--good);color:var(--good)}.pill.bad{border-color:var(--bad);color:var(--bad)}.pill.wait{border-color:var(--warn);color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.intro{margin:0 0 12px;color:var(--mute);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;direction:rtl}
@media (max-width:380px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{font-family:var(--he);font-size:34px;line-height:1;padding:10px 4px 6px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:72px}
.tile small{font-family:var(--ui);font-size:11px;color:var(--mute);direction:ltr}
.tile.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.tile:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{font:500 15px var(--ui);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn:hover{border-color:var(--gold)}.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.btn.rec{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:700;font-size:18px;min-height:56px}
.btn.wide{width:100%;display:block;margin-top:10px}.btn:disabled{opacity:.45;cursor:default}
.link{font:500 14px var(--ui);color:var(--gold);background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.head{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.head .big{font-family:var(--he);font-size:64px;line-height:1;color:var(--gold);min-width:64px;text-align:center}
.head .nm{font-size:20px;font-weight:600}.head .nm small{display:block;font-size:14px;color:var(--mute);font-weight:400}
.tip{margin:0 0 12px;font-size:15px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:0 0 12px}
.seg button{flex:1;font:500 14px var(--ui);color:var(--fg);background:transparent;border:0;padding:10px 8px;cursor:pointer;min-height:44px}
.seg button.on{background:var(--gold);color:var(--ink);font-weight:700}
.seg button .he{font-family:var(--he);font-size:20px;margin-inline-end:4px}
.ex{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);margin:0 0 10px}
.ex .w{font-family:var(--he);font-size:38px;line-height:1.3;direction:rtl;font-weight:500}
.ex .w small{display:block;font-family:var(--ui);font-size:12px;color:var(--mute);direction:ltr;font-weight:400}
.ex .w .hl{color:var(--gold);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0}
.verdict{margin:14px 0 0;padding:14px;border-radius:12px;background:var(--bg);display:flex;gap:14px;align-items:flex-start}
.verdict .mark{font-size:40px;line-height:1;min-width:44px;text-align:center}
.verdict.right .mark{color:var(--good)}.verdict.wrong .mark{color:var(--bad)}.verdict.unsure .mark{color:var(--warn)}
.verdict .say{font-size:18px;font-weight:600;margin:0 0 4px}.verdict .more{margin:0;font-size:15px;color:var(--mute)}
.heard{margin:8px 0 0;font-size:14px;color:var(--mute)}.heard b{color:var(--fg);font-weight:500;font-family:ui-monospace,Menlo,monospace}
.lab{font-size:12px;color:var(--mute);margin:8px 0 0;white-space:pre-wrap;word-break:break-word}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}.hist span{font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.hist .right{color:var(--good);border-color:var(--good)}.hist .wrong{color:var(--bad);border-color:var(--bad)}.hist .unsure{color:var(--warn);border-color:var(--warn)}
.busy{margin:10px 0 0;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.err{color:var(--bad);font-size:14px;margin:10px 0 0}.err:empty{display:none}
.mode{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.mode input{width:18px;height:18px;accent-color:var(--gold)}
</style>
<div class="wrap">
 <header class="top"><h1>Letters</h1><span class="pill wait" id="srv">Waking the server…</span></header>
 <section class="card">
  <p class="intro">Pick a letter. Hear how Rabbi Alouf says it, then say it yourself — the letter with its vowel, or his whole word. The machine judges the opening sound of your take.</p>
  <div class="grid" id="grid"></div>
  <label class="mode" style="margin-top:12px"><input type="checkbox" id="strict"> Strict — "not sure" counts as not yet right</label>
 </section>
 <section class="card" id="card" hidden>
  <div class="head"><div class="big" id="big"></div><div class="nm" id="nm"></div></div>
  <p class="tip" id="tip"></p>
  <div class="seg" id="seg" hidden></div>
  <div class="ex"><div class="w" id="exw"></div><div class="row"><button class="btn" id="hear" type="button">▶ Hear him</button><button class="link" id="next" type="button">another word</button></div></div>
  <p class="hint" id="you" style="margin:0 0 6px"></p>
  <button class="btn wide rec" id="rec" type="button">● Say it</button>
  <p class="hint" id="note">Tap, then say it right away. The recording stops by itself.</p>
  <div id="out" hidden>
   <div class="verdict" id="verdict"><div class="mark" id="mark"></div><div><p class="say" id="say"></p><p class="more" id="more"></p><p class="heard" id="heard"></p></div></div>
   <div class="row" style="margin-top:10px"><button class="btn" id="mine" type="button">▶ Play mine</button><button class="btn" id="his" type="button">▶ Play his</button><button class="link" id="labBtn" type="button">details</button></div>
   <p class="lab" id="lab" hidden></p>
  </div>
  <p class="busy" id="busy" hidden><span class="spin"></span><span>Listening…</span></p>
  <p class="err" id="err"></p>
  <div class="hist" id="hist"></div>
 </section>
</div>
<script>
const $=s=>document.querySelector(s);
const API=location.origin;const url=p=>API+p;
const RAW='https://raw.githubusercontent.com/davidsitt810-ops/dikduk-space/main/static/';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}};
let L=null,CUR=null,WANT=null,EX=0,TAKE_URL=null,HIS=null,MINE=null,HIST=[];
async function health(){const el=$('#srv');try{const r=await fetch(url('/health'),{cache:'no-store'});const j=await r.json();el.className='pill ok';el.textContent='Ready'+(j.version?' · v'+j.version:'');if(!j.letters){el.className='pill bad';el.textContent='Server is older than this page: it has no letter checker yet';}}
 catch(e){el.className='pill bad';el.textContent='Server not answering';setTimeout(health,8000);}}
async function load(){try{L=await (await fetch(url('/letters.json'),{cache:'no-store'})).json();}catch(e){try{L=await (await fetch(RAW+'letters.json',{cache:'no-store'})).json();}catch(e2){$('#err').textContent='Could not load the letters.';return;}}
 const g=$('#grid');g.innerHTML=L.letters.map(x=>`<button class="tile" type="button" data-c="${x.c}">${x.c}<small>${esc(x.name)}</small></button>`).join('');
 g.querySelectorAll('.tile').forEach(b=>b.onclick=()=>pick(b.dataset.c));
 /* a link can open one letter: /letters?c=ע (&want=v), or /letters#ע — the line checker's "practice" links */
 const Q=new URLSearchParams(location.search);let want=Q.get('c')||'';try{want=want||decodeURIComponent(location.hash.slice(1));}catch(e){}
 if(want&&L.letters.some(x=>x.c===want)){pick(want);const w=Q.get('want');if(w&&CUR.want&&CUR.want.some(x=>x[0]===w)){const b=document.querySelector(`#seg button[data-k="${w}"]`);if(b)b.click();}return;}
 const last=ls('dk.letters.last');if(last&&L.letters.some(x=>x.c===last))pick(last);}
function pick(c){CUR=L.letters.find(x=>x.c===c);if(!CUR)return;ls('dk.letters.last',c);
 document.querySelectorAll('.tile').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
 $('#card').hidden=false;$('#big').textContent=CUR.c;$('#nm').innerHTML=esc(CUR.name)+'<small>'+esc(CUR.he||'')+'</small>';
 WANT=CUR.want?CUR.want[0][0]:null;const seg=$('#seg');seg.hidden=!CUR.want;
 if(CUR.want){seg.innerHTML=CUR.want.map(([k,lab])=>`<button type="button" data-k="${k}" class="${k===WANT?'on':''}">${esc(lab)}</button>`).join('');seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{WANT=b.dataset.k;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));EX=0;showEx();reset();});}
 $('#tip').textContent=tipFor();EX=0;showEx();reset();$('#hist').innerHTML='';HIST=[];
 $('#card').scrollIntoView({behavior:'smooth',block:'start'});}
function tipFor(){if(CUR.want){const w=CUR.want.find(x=>x[0]===WANT);return (CUR.tips&&CUR.tips[WANT])||(w?w[1]:'')||'';}return CUR.tip||'';}
function examples(){const E=CUR.examples||{};return E[WANT||'']||E['']||[];}
function marked(pointed,k){const g=String(pointed||'').match(/[\u05d0-\u05ea][\u0591-\u05c7]*|./g)||[];let i=-1;return g.map(x=>{if(/^[\u05d0-\u05ea]/.test(x))i++;return i===k?`<span class="hl">${esc(x)}</span>`:esc(x);}).join('');}
function showEx(){const ex=examples();$('#tip').textContent=tipFor();if(!ex.length){$('#exw').innerHTML='<small>no example word yet</small>';$('#hear').disabled=true;$('#next').hidden=true;$('#you').textContent='';return;}
 EX=EX%ex.length;const e=ex[EX];const k=e.k||0;$('#exw').innerHTML=marked(e.pointed||e.w,k)+`<small>Rabbi Alouf, Tehillim ${e.per}:${e.ps+1}</small>`;$('#hear').disabled=false;$('#next').hidden=ex.length<2;
 $('#you').textContent=k>0?`He says the ${CUR.c} inside this word. You: say just the letter with its vowel (${CUR.c}ֶ), not the whole word — the machine judges the first sound it hears.`:'You: say his word, or just the letter with its vowel. The machine judges the first sound it hears.';
 HIS=new Audio(url('/letters/audio/'+e.audio));HIS.onerror=()=>{HIS=new Audio(RAW+'letters/'+e.audio);};}
$('#next').onclick=()=>{EX++;showEx();};
$('#hear').onclick=()=>{if(HIS){HIS.currentTime=0;HIS.play().catch(()=>{});}};
$('#his').onclick=()=>$('#hear').onclick();
function reset(){$('#out').hidden=true;$('#err').textContent='';$('#rec').hidden=false;$('#note').textContent='Tap, then say it right away. The recording stops by itself.';}
/* ---------- recording: 2.5 s, stops by itself (or on a second tap) ---------- */
let MR=null,CH=[],T0=0,TK=null;
$('#rec').onclick=async()=>{if(MR&&MR.state==='recording'){MR.stop();return;}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm',''].find(t=>!t||MediaRecorder.isTypeSupported(t));
  MR=new MediaRecorder(st,mt?{mimeType:mt}:undefined);CH=[];MR.ondataavailable=e=>{if(e.data.size)CH.push(e.data);};
  MR.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(TK);$('#rec').textContent='● Say it';send(new Blob(CH,{type:MR.mimeType||'audio/mp4'}));};
  MR.start(100);T0=Date.now();$('#out').hidden=true;$('#err').textContent='';$('#rec').textContent='● 2.5';$('#note').textContent='Say it now…';
  TK=setInterval(()=>{const left=Math.max(0,2.5-(Date.now()-T0)/1000);$('#rec').textContent='● '+left.toFixed(1);if(left<=0)MR.stop();},100);}
 catch(e){$('#err').textContent='The microphone could not be used: '+e.message;}};
async function send(blob){if(TAKE_URL)URL.revokeObjectURL(TAKE_URL);TAKE_URL=URL.createObjectURL(blob);MINE=null;
 $('#busy').hidden=false;$('#rec').disabled=true;$('#note').textContent='';
 try{const q=new URLSearchParams({c:CUR.c});if(WANT)q.set('want',WANT);if($('#strict').checked)q.set('strict','1');
  const r=await fetch(url('/letter?'+q),{method:'POST',body:blob,headers:{'Content-Type':blob.type||'application/octet-stream'}});const j=await r.json();
  if(!r.ok||j.err)throw new Error(j.err||('server '+r.status));show(j);}
 catch(e){$('#err').textContent='Could not check it: '+e.message;}
 $('#busy').hidden=true;$('#rec').disabled=false;}
function show(j){$('#out').hidden=false;const v=j.v||'unsure';const V=$('#verdict');V.className='verdict '+v;
 $('#mark').textContent=v==='right'?'✓':v==='wrong'?'✕':v==='no_speech'?'…':'~';$('#say').textContent=j.say||'';$('#more').textContent=j.more||'';
 $('#heard').innerHTML=j.heard&&j.heard.length?'I heard: <b>'+esc(j.heard.join(' '))+'</b>'+(j.alouf?' · Rabbi Alouf: <b>'+esc(j.alouf)+'</b>':''):'';
 $('#lab').textContent=lab(j);$('#lab').hidden=true;
 if(v!=='no_speech'){HIST.unshift(v);HIST=HIST.slice(0,8);$('#hist').innerHTML=HIST.map(x=>`<span class="${x}">${x==='right'?'✓':x==='wrong'?'✕':'~'}</span>`).join('');}
 $('#out').scrollIntoView({behavior:'smooth',block:'nearest'});}
function lab(j){const f=o=>o?Object.entries(o).filter(([k,v])=>v>=0.05).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>'\u2066'+k+'\u2069 '+v.toFixed(2)).join('  '):'';
 let s=`window ${j.win?j.win.join('–'):'?'} s of ${j.dur} s · ${j.ms} ms\nphone ear: ${f(j.peak)}\nArabic ear: ${f(j.ar_peak)}\nletter head: ${f(j.head_peak)}`;
 if(j.throat)s+=`\nthroat votes: for ${JSON.stringify(j.throat.votes&&j.throat.votes.throat)} against ${JSON.stringify(j.throat.votes&&j.throat.votes.plain)} · classifier ${j.throat.p2!=null?j.throat.p2:j.throat.p}`;
 if(j.why)s+=`\nrule: ${j.why}`;return s;}
$('#labBtn').onclick=()=>{$('#lab').hidden=!$('#lab').hidden;};
$('#mine').onclick=()=>{if(!TAKE_URL)return;if(!MINE){MINE=new Audio(TAKE_URL);}MINE.currentTime=0;MINE.play().catch(()=>{});};
try{$('#strict').checked=ls('dk.letters.strict')==='1';}catch(e){}
$('#strict').onchange=()=>ls('dk.letters.strict',$('#strict').checked?'1':'0');
health();load();
</script>
